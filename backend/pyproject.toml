[project]
name = "pwe-backend"
version = "0.1.0"
description = "PWE — Prüf-Workflow-Engine Backend"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
persistence = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1", "alembic>=1.13"]
pdf = ["fpdf2>=2.7"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "python-multipart>=0.0.9"]
com = ["pyserial>=3.5"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
markers = [
    "postgresql: Tests gegen PostgreSQL (DATABASE_URL erforderlich)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
