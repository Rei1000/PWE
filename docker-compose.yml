services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Backend: Entrypoint migriert (alembic upgrade head), dann uvicorn — kein create_all.
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/app
      PWE_DATEI_STORAGE_PFAD: /var/pwe/dateien
      # Development: erlaubt Default-Seed-Passwort admin-change-me (nur lokal).
      # Produktion: ENV ändern + PWE_SEED_ADMIN_PASSWORD setzen oder PWE_SEED_ADMIN=false.
      ENV: development
    volumes:
      - pwe_dateien:/var/pwe/dateien
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pwe_dateien:
